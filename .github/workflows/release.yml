name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Package and Publish Extension Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Test Suite
        run: npm test

      - name: Build Extension ZIP
        run: npm run package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/snip-extension-v1.0.0.zip
          name: Snip Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
